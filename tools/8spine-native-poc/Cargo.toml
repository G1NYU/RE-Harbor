[package]
name = "harbor-8spine-native-poc"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
windows-sandbox-fixture = []

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2.5"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }

tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util"] }
