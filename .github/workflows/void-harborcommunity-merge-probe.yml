name: VOID + Harbor 1.0.4 merge audit

on:
  push:
    branches:
      - upgrade/void-to-harborcommunity-1.0.4-beta
    paths:
      - .github/workflows/void-harborcommunity-merge-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-probe:
    name: Audit non-committing upstream merge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VOID_EXPECTED: b81ee522fbb931be0c1d3b63691c7bcb37b030ef
      OFFICIAL_EXPECTED: c4f0242a65e9a0b57da4f877e0df8b8f360aab06
      ANCESTOR_EXPECTED: cd2a0aff335fb9936146b6434098a7e10b14a421
    steps:
      - name: Checkout protected VOID snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Three-way merge all 1.0.4 changes (audit only, no push)
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p merge-report
          git merge-base --is-ancestor "$VOID_EXPECTED" HEAD || {
            echo 'Upgrade branch is not descended from the pinned VOID commit.'
            exit 1
          }
          # The workflow addition itself introduces one commit on this branch.
          CHANGED_SINCE_BASE="$(git diff --name-only "$VOID_EXPECTED" HEAD)"
          [[ "$CHANGED_SINCE_BASE" == "$(printf '%s\n' '.github/scripts/void-harborcommunity-merge-fixes.py' '.github/workflows/void-harborcommunity-merge-probe.yml')" ]] || {
            echo 'Unexpected source changes since pinned VOID. Stop before merging.'
            printf '%s\n' "$CHANGED_SINCE_BASE"
            exit 1
          }
          git remote add harborcommunity https://github.com/HarborCommunity/Harbor.git
          git fetch --no-tags harborcommunity refs/tags/v1.0.4-beta
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$OFFICIAL_EXPECTED" ]] || {
            echo 'Official release tag moved. Stopping rather than merging an unexpected commit.'
            exit 1
          }
          [[ "$(git merge-base HEAD "$OFFICIAL_EXPECTED")" == "$ANCESTOR_EXPECTED" ]] || {
            echo 'Unexpected common ancestor. Stop for inspection.'
            exit 1
          }
          set +e
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c merge.conflictStyle=zdiff3 merge --no-commit --no-ff "$OFFICIAL_EXPECTED" \
            > merge-report/merge-output.txt 2>&1
          MERGE_EXIT=$?
          set -e
          git diff --name-only --diff-filter=U > merge-report/conflicted-files.txt
          git ls-files -u > merge-report/unmerged-index.txt
          git status --short > merge-report/status.txt
          git diff --cached --stat > merge-report/staged-stat.txt
          git diff --cc > merge-report/conflict-hunks.diff || true
          {
            echo "void_commit=$VOID_EXPECTED"
            echo "official_commit=$OFFICIAL_EXPECTED"
            echo "common_ancestor=$ANCESTOR_EXPECTED"
            echo "merge_exit=$MERGE_EXIT"
            echo "conflicted_path_count=$(wc -l < merge-report/conflicted-files.txt)"
            echo 'no_commit=true'
            echo 'no_push=true'
            echo 'no_deployment=true'
          } > merge-report/SUMMARY.txt
          cat merge-report/SUMMARY.txt
          if ((MERGE_EXIT > 1)); then
            echo 'Git merge failed abnormally; see merge-output.txt.'
            exit "$MERGE_EXIT"
          fi

      - name: Upload merge audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-1.0.4-merge-audit
          path: merge-report/
          if-no-files-found: warn
          retention-days: 30

  merge-candidate-check:
    name: Validate tentative merge (prefer VOID for conflicting hunks)
    needs: merge-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VOID_EXPECTED: b81ee522fbb931be0c1d3b63691c7bcb37b030ef
      OFFICIAL_EXPECTED: c4f0242a65e9a0b57da4f877e0df8b8f360aab06
      ANCESTOR_EXPECTED: cd2a0aff335fb9936146b6434098a7e10b14a421
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout isolated upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare candidate without committing or pushing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-report
          test "$(git merge-base "$VOID_EXPECTED" HEAD)" = "$VOID_EXPECTED"
          CHANGED_SINCE_BASE="$(git diff --name-only "$VOID_EXPECTED" HEAD)"
          [[ "$CHANGED_SINCE_BASE" == "$(printf '%s\n' '.github/scripts/void-harborcommunity-merge-fixes.py' '.github/workflows/void-harborcommunity-merge-probe.yml')" ]] || {
            printf 'Unexpected changed paths:\n%s\n' "$CHANGED_SINCE_BASE"
            exit 1
          }
          git remote add harborcommunity https://github.com/HarborCommunity/Harbor.git
          git fetch --no-tags harborcommunity refs/tags/v1.0.4-beta
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$OFFICIAL_EXPECTED" ]]
          [[ "$(git merge-base HEAD "$OFFICIAL_EXPECTED")" == "$ANCESTOR_EXPECTED" ]]
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c merge.conflictStyle=zdiff3 merge -X ours --no-commit --no-ff "$OFFICIAL_EXPECTED" \
            > candidate-report/merge-output.txt 2>&1 || {
              cat candidate-report/merge-output.txt
              git diff --name-only --diff-filter=U > candidate-report/remaining-conflicts.txt
              exit 1
            }
          git diff --name-only --diff-filter=U > candidate-report/remaining-conflicts.txt
          test ! -s candidate-report/remaining-conflicts.txt
          python3 .github/scripts/void-harborcommunity-merge-fixes.py
          git add -- src/components/music/music-dock.tsx src/components/music/music-gif-settings.tsx src/components/music/music-miku-visualizer.tsx src/components/music/music-now-playing.tsx src/views/settings/theme-panel/startup-artwork.tsx
          git diff --cached --stat > candidate-report/merged-stat.txt
          git diff --cached --name-status > candidate-report/merged-files.txt
          git diff HEAD "$OFFICIAL_EXPECTED" --stat -- src/ src-tauri/ installer/ scripts/ > candidate-report/custom-vs-upstream-stat.txt
          {
            echo "official_ref=$OFFICIAL_EXPECTED"
            echo "void_ref=$VOID_EXPECTED"
            echo 'strategy=git merge -X ours, then five reviewed JSX overlap repairs'
            echo 'commit_created=false'
            echo 'pushed=false'
          } > candidate-report/SUMMARY.txt
          for file in \
            src/components/music/music-dock.tsx \
            src/components/music/music-gif-settings.tsx \
            src/components/music/music-miku-visualizer.tsx \
            src/components/music/music-now-playing.tsx \
            src/views/settings/theme-panel/startup-artwork.tsx; do
            mkdir -p "candidate-report/merged-sources/$(dirname "$file")"
            cp "$file" "candidate-report/merged-sources/$file"
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install candidate dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck merged candidate
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee candidate-report/typecheck.txt

      - name: Run targeted VOID + Refract + Music regressions
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --import ./scripts/node-test-environment.mjs --experimental-loader ./scripts/node-test-loader.mjs --test \
            tests/refract-sync.test.mjs tests/refract-library-removal.test.mjs \
            tests/void-sidebar-order.test.ts tests/music-audio-meter.test.ts \
            tests/music-ui-polish.test.ts 2>&1 | tee candidate-report/focused-tests.txt

      - name: Evaluate candidate validation
        if: always() && steps.typecheck.outcome != 'skipped'
        shell: bash
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }}" >> candidate-report/SUMMARY.txt
          echo "focused_regressions=${{ steps.regressions.outcome }}" >> candidate-report/SUMMARY.txt
          if [[ "${{ steps.typecheck.outcome }}" != 'success' || "${{ steps.regressions.outcome }}" != 'success' ]]; then
            exit 1
          fi

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-1.0.4-tentative-merge-validation
          path: candidate-report/
          if-no-files-found: warn
          retention-days: 30
