name: Temporary upstream native Music focused tests

on:
  push:
    branches:
      - validation/upstream-native-music-check

permissions:
  contents: read

jobs:
  music-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux native playback dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev \
            libmpv-dev librsvg2-dev libssl-dev libudev-dev \
            libwebkit2gtk-4.1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
      - name: Native spectrum parser tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib music::spectrum::tests -- --nocapture
      - name: Native Last.fm tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib music::lastfm::tests -- --nocapture
      - name: Native playback and stereo audio tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib music::engine_tests:: -- --nocapture
      - name: Native stream resolution and cache tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib music::commands::search::tests -- --nocapture
