name: VOID + Refract Windows installer

on:
  push:
    branches:
      - feature/void-refract-installer

permissions:
  contents: read

concurrency:
  group: void-refract-nsis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build and verify Windows setup
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      HARBOR_CHANNEL: beta
      HARBOR_CAPSTAN_OPTIONAL: "1"
      HARBOR_POKEMON_OPTIONAL: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify isolated Windows installer configuration
        run: node --test tests/void-windows-installer.test.mjs

      - name: Prepare exactly the same preview sidecars and fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HARBOR_CAPSTAN_SRC = Join-Path $env:RUNNER_TEMP 'void-installer-no-extension-runtime'
          foreach ($script in @('setup:binaries', 'setup:libmpv', 'setup:mpv')) {
            pnpm run $script
            if ($LASTEXITCODE -ne 0) { throw "Preview dependency step failed: $script" }
          }
          # The raw GitHub font host intermittently returns HTTP 503.
          # fetch-fonts.mjs SHA-256 verifies each downloaded file and skips
          # verified files, so only transient failures are retried.
          $fontReady = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            pnpm run setup:fonts
            if ($LASTEXITCODE -eq 0) { $fontReady = $true; break }
            if ($attempt -lt 4) {
              Write-Warning "Font endpoint failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $fontReady) { throw 'Verified font download failed after four attempts' }
          pnpm run setup:capstan
          if ($LASTEXITCODE -ne 0) { throw 'Preview extension setup failed' }

      - name: Build signed-independent per-user NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri build --bundles nsis --config src-tauri/tauri.music-preview.conf.json --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.void-installer.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'VOID NSIS packaging failed' }

      - name: Stage and verify the setup executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one NSIS setup executable, got $($setups.Count)" }
          $exe = $setups[0]
          if ($exe.Length -lt 50MB) { throw 'Installer is unexpectedly small; bundled dependencies may be missing' }
          $rootExe = 'src-tauri/target/release/harbor.exe'
          if (-not (Test-Path -LiteralPath $rootExe)) { throw 'Compiled harbor.exe is missing' }
          foreach ($binary in @(
            'src-tauri/libmpv/libmpv-2.dll',
            'src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe',
            'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe',
            'src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe',
            'src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe'
          )) {
            if (-not (Test-Path -LiteralPath $binary)) { throw "Missing sidecar input: $binary" }
          }
          $output = 'void-installer-artifact'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $dest = Join-Path $output 'Harbor-VOID-Refract-Setup-x64.exe'
          Copy-Item -LiteralPath $exe.FullName -Destination $dest -Force
          $sha = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash
          "SHA256 $sha  Harbor-VOID-Refract-Setup-x64.exe" | Set-Content -LiteralPath (Join-Path $output 'SHA256.txt') -Encoding UTF8
          @'
          HARBOR VOID + REFRACT — WINDOWS INSTALLER (x64)
          =================================================
          1. Double-click Harbor-VOID-Refract-Setup-x64.exe.
          2. Install for the current Windows user; administrator rights are not required.
          3. Launch Harbor VOID from the Start menu or installed shortcut.
          4. To uninstall, use Windows Settings > Apps > Installed apps.

          The installer uses the same app identifier as the previously tested
          portable VOID preview: app.harbor.voidnativepreview.
          It does NOT replace the official Harbor installation or take over
          default video file associations or stock Harbor deep-link schemes.
          Automatic updates are disabled for this personal build.
          Your tested VOID music and Refract application code is unchanged.

          This is an unsigned independent build. Windows SmartScreen may show a
          publisher warning. Only run it if you trust this GitHub Actions build.
          Android extension support and the Pokemon engine remain absent,
          matching the prior portable preview.
          '@ | Set-Content -LiteralPath (Join-Path $output 'INSTALL-INSTRUCTIONS.txt') -Encoding UTF8
          Write-Host "VERIFIED_INSTALLER=$dest"
          Write-Host "INSTALLER_BYTES=$($exe.Length)"
          Write-Host "INSTALLER_SHA256=$sha"

      - name: Confirm setup installs to an isolated per-user location
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'void-installer-artifact/Harbor-VOID-Refract-Setup-x64.exe').Path
          $before = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq 'Harbor VOID' })
          if ($before.Count) { throw 'A previous Harbor VOID installation is present on the test runner' }
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent NSIS install failed: $($install.ExitCode)" }
          $entries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq 'Harbor VOID' })
          if ($entries.Count -ne 1) { throw "Expected an isolated Harbor VOID uninstall registration, found $($entries.Count)" }
          $location = $entries[0].InstallLocation
          if (-not $location) { $location = Join-Path $env:LOCALAPPDATA 'Harbor VOID' }
          if (-not (Test-Path -LiteralPath (Join-Path $location 'harbor.exe'))) {
            throw "Installed Harbor executable missing at $location"
          }
          $uninstaller = Join-Path $location 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'Windows uninstall executable is missing' }
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Harbor VOID.lnk'
          if (-not (Test-Path -LiteralPath $startMenu)) { throw 'Harbor VOID Start menu shortcut is missing' }
          Write-Host "INSTALLED_APP_PATH=$location"
          Write-Host "UNINSTALL_REGISTERED=true"
          Write-Host "START_MENU_SHORTCUT=true"
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Silent NSIS uninstall failed: $($remove.ExitCode)" }
          Write-Host 'PER_USER_INSTALL_AND_UNINSTALL_VERIFIED=true'

      - name: Upload the verified installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-void-refract-windows-installer-x64
          path: void-installer-artifact/
          if-no-files-found: error
          retention-days: 14
