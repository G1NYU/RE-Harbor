name: Temporary beta-branch baseline tests

on:
  push:
    branches:
      - validation/harbor-beta-suite-baseline

permissions:
  contents: read

jobs:
  compare-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - name: Run existing beta-branch full test command unchanged
        run: vp run test
