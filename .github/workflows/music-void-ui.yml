name: VOID Native + Music UI

on:
  push:
    branches: [feature/void-native-rebuild-n]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: VOID Native and music UI typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - name: Typecheck
        run: vp run typecheck
      - name: Dock and now-playing regressions
        run: |
          node --import ./scripts/node-test-environment.mjs --experimental-loader ./scripts/node-test-loader.mjs --test \
            tests/music-void-ui.test.ts \
            tests/music-dock-clearance.test.ts \
            tests/music-now-playing-key.test.ts \
            tests/void-native.test.ts
