name: VOID Native + Refract Validation

on:
  push:
    branches: ['feature/void-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: VOID/Refract application typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - name: Typecheck
        run: vp run typecheck
      - name: Dock and now-playing regressions
        run: |
          node --import ./scripts/node-test-environment.mjs --experimental-loader ./scripts/node-test-loader.mjs --test \
            tests/music-void-ui.test.ts \
            tests/music-dock-clearance.test.ts \
            tests/music-now-playing-key.test.ts \
            tests/void-native.test.ts \
            tests/void-native-cohesion.test.ts \
            tests/music-cover-art-url.test.ts \
            tests/void-shell.test.ts \
            tests/void-music-editorial.test.ts \
            tests/void-studio-music.test.ts \
            tests/void-watch.test.ts
      - name: Refract API, identity, and sync tests
        run: node --test tests/refract-api.test.mjs tests/refract-sync.test.mjs tests/refract-identity.test.mjs tests/refract-bulk-account.test.mjs
