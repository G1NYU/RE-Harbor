name: Music Listening Room UI

on:
  push:
    branches: [feature/music-void-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-void-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Music UI typecheck and scoped regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - name: Typecheck
        run: vp run typecheck
      - name: Dock and now-playing regressions
        run: |
          node --import ./scripts/node-test-environment.mjs --experimental-loader ./scripts/node-test-loader.mjs --test \
            tests/music-void-ui.test.ts \
            tests/music-dock-clearance.test.ts \
            tests/music-now-playing-exit.test.ts \
            tests/music-now-playing-key.test.ts
