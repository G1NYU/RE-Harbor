name: Refract targeted regression validation

on:
  push:
    branches:
      - validation/refract-library-formatter

permissions:
  contents: read

jobs:
  focused:
    name: Verify Library removal and History paths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 1.5.1
          node-version: 24
          run-install: |
            args:
              - --frozen-lockfile
      - name: Validate exact PR head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/refract-upstream
          test "$(git rev-parse FETCH_HEAD)" = "24eadc5fc7391144625ef8d91342bde8e7666af3"
          git switch --detach FETCH_HEAD
          vp fmt --check tests/watchlist-history.test.ts tests/refract-library-removal.test.mjs
          vp run typecheck
          node --import ./scripts/node-test-environment.mjs --experimental-loader ./scripts/node-test-loader.mjs --test tests/watchlist-history.test.ts tests/refract-library-removal.test.mjs
