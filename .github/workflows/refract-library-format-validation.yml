name: Refract Library formatter validation

on:
  push:
    branches:
      - validation/refract-library-formatter

permissions:
  contents: read

jobs:
  format:
    name: Generate the exact pinned formatter output
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 1.5.1
          node-version: 24
          run-install: |
            args:
              - --frozen-lockfile
      - name: Format and emit public regression test
        shell: bash
        run: |
          vp fmt tests/refract-library-removal.test.mjs
          echo REFRACT_FORMAT_START
          base64 -w0 tests/refract-library-removal.test.mjs
          echo
          echo REFRACT_FORMAT_END
