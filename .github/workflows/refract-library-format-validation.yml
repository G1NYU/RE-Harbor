name: Refract upstream merge probe

on:
  push:
    branches:
      - validation/refract-library-formatter

permissions:
  contents: read

jobs:
  merge-probe:
    name: Identify conflicts without changing any branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate current beta merge read-only
        shell: bash
        run: |
          git remote add upstream https://github.com/Harborofficial/Harbor.git
          git fetch --no-tags upstream +refs/heads/beta-branch:refs/remotes/upstream/beta-branch
          git config user.name "Read-only merge probe"
          git config user.email "probe@users.noreply.github.com"
          echo "PROBE_HEAD=$(git rev-parse HEAD)"
          echo "PROBE_BETA=$(git rev-parse upstream/beta-branch)"
          echo "PROBE_BASE=$(git merge-base HEAD upstream/beta-branch)"
          set +e
          git merge --no-commit --no-ff upstream/beta-branch > merge-output.txt 2>&1
          result=$?
          set -e
          echo "PROBE_MERGE_EXIT=$result"
          sed -n '1,100p' merge-output.txt
          echo PROBE_CONFLICTS_START
          git diff --name-only --diff-filter=U
          echo PROBE_CONFLICTS_END
          if [ "$result" -ne 0 ]; then
            git merge --abort || true
          fi
