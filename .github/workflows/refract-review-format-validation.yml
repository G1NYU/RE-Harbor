name: Refract review focused tests

on:
  push:
    branches:
      - validation/refract-review-formatter

permissions:
  contents: read

jobs:
  focused:
    name: Verify the exact follow-up PR head
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 1.5.1
          node-version: 24
          run-install: |
            args:
              - --frozen-lockfile
      - name: Typecheck and focused Refract regressions
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach c5f1eeff840e31d0bccd1fdba6c1f37d9196499c
          vp run typecheck
          node --import ./scripts/node-test-environment.mjs --experimental-loader ./scripts/node-test-loader.mjs --test tests/refract-api.test.mjs tests/refract-sync.test.mjs tests/refract-library-removal.test.mjs tests/refract-identity.test.mjs tests/refract-bulk-account.test.mjs tests/refract-locales.test.mjs tests/watchlist-history.test.ts
