name: Music reliability

on:
  push:
    branches: [feature/music-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - name: Typecheck
        run: vp run typecheck
      - name: Music regression tests
        run: node --import ./scripts/node-test-environment.mjs --experimental-loader ./scripts/node-test-loader.mjs --test tests/music-*.test.ts

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libayatana-appindicator3-dev libgtk-3-dev libmpv-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
      - name: Native music tests
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml network_audio_cache_has_bounded_lookahead_and_rebuffer_threshold
