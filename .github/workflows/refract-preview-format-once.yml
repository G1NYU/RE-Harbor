name: Format Refract Preview

on:
  push:
    branches:
      - feature/batcave-refract-combined

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          run-install: |
            args:
              - --frozen-lockfile
      - name: Format only Refract-modified source files
        run: |
          vp fmt \
            src/lib/refract/client.ts \
            src/lib/refract/sync.ts \
            src/views/settings/refract-panel.tsx \
            src/lib/secret-store.ts \
            src/lib/watch-events.ts \
            src/lib/media-context-actions.ts \
            src/views/settings/trackers-panel.tsx \
            src/views/player/hooks/use-resume-autosave.ts \
            src/lib/mark-watched.ts \
            src/main.tsx
          git diff --check
      - name: Commit formatting only
        shell: bash
        run: |
          git add -- \
            src/lib/refract/client.ts src/lib/refract/sync.ts \
            src/views/settings/refract-panel.tsx src/lib/secret-store.ts \
            src/lib/watch-events.ts src/lib/media-context-actions.ts \
            src/views/settings/trackers-panel.tsx \
            src/views/player/hooks/use-resume-autosave.ts \
            src/lib/mark-watched.ts src/main.tsx
          if git diff --cached --quiet; then
            echo "Source formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(refract): format combined preview source"
          git push origin HEAD:feature/batcave-refract-combined
