name: One-Time Snappy Formatter

on:
  push:
    branches:
      - feature/snappy-startup-msi
    paths:
      - .github/workflows/snappy-format-once.yml

permissions:
  contents: write

jobs:
  format-snappy:
    if: github.repository == 'G1NYU/RE-Harbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      - name: Format changed startup and UI code
        run: |
          vp fmt src/main.tsx src/views/detail.tsx src/views/person.tsx src/views/home.tsx tests/snappy-startup.test.mjs
          git diff --check
          git diff --stat
      - name: Commit mechanical formatting
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.tsx src/views/detail.tsx src/views/person.tsx src/views/home.tsx tests/snappy-startup.test.mjs
            git commit -m "style(perf): format startup responsiveness pass"
            git push origin HEAD:feature/snappy-startup-msi
          fi
