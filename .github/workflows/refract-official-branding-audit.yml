name: Refract official branding formatter

on:
  push:
    branches:
      - validation/refract-official-branding

permissions:
  contents: write

jobs:
  format:
    name: Apply pinned formatter to brand regression test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 1.5.1
          node-version: 24
          run-install: |
            args:
              - --frozen-lockfile
      - name: Format only the Refract branding regression
        shell: bash
        run: |
          set -euo pipefail
          expected_head=9de52c651ed8ea8128b9f772419de79b2dffa0db
          git switch --detach "$expected_head"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          vp fmt tests/refract-api.test.mjs
          vp fmt --check tests/refract-api.test.mjs
          git diff --check
          git add tests/refract-api.test.mjs
          test "$(git diff --cached --name-only)" = "tests/refract-api.test.mjs"
          git commit -m "style(refract): format official branding regression"
          echo "FORMATTED_BRAND_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/validation/refract-brand-asset
