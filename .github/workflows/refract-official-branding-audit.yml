name: Refract official brand asset extraction

on:
  push:
    branches:
      - validation/refract-official-branding

permissions:
  contents: write

jobs:
  prepare-asset:
    name: Import official 512px transparent Refract icon
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract a verified public press-kit asset
        shell: bash
        run: |
          set -euo pipefail
          expected_head=9069b9d495637164bdf9551f416243abdaf13521
          expected_target=validation/refract-brand-asset
          git switch --detach "$expected_head"
          curl --retry 2 --retry-delay 2 --fail --location --silent --show-error --max-time 45 -o /tmp/refract-press-kit.zip https://getrefract.app/assets/press/refract-press-kit.zip
          unzip -p /tmp/refract-press-kit.zip refract-press-kit/logos/refract-logo-transparent-512.png > src/assets/refract.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("src/assets/refract.png")
          data = p.read_bytes()
          assert len(data) > 1024 and len(data) < 1_000_000, "Unexpected official logo size"
          assert data[:8] == b"\\x89PNG\\r\\n\\x1a\\n", "Not PNG"
          assert data[12:16] == b"IHDR", "Missing PNG header"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (512, 512), f"Unexpected dimensions: {width}x{height}"
          print(f"OFFICIAL_LOGO_VERIFIED {width}x{height} bytes={len(data)} color_type={data[25]}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/refract.png
          test "$(git diff --cached --name-only)" = "src/assets/refract.png"
          git commit -m "assets(refract): import official transparent prism logo from press kit"
          echo "OFFICIAL_ASSET_COMMIT=$(git rev-parse HEAD)"
          echo "OFFICIAL_ASSET_SHA256=$(sha256sum src/assets/refract.png)"
          git push origin HEAD:refs/heads/"$expected_target"
