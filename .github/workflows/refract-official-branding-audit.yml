name: Refract official branding verification

on:
  push:
    branches:
      - validation/refract-official-branding

permissions:
  contents: read

jobs:
  verify:
    name: Verify the exact official logo integration
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 1.5.1
          node-version: 24
          run-install: |
            args:
              - --frozen-lockfile
      - name: Formatting, TypeScript, and Refract tests
        shell: bash
        run: |
          set -euo pipefail
          expected_head=1b72d2887ffa08520ac5b11a78ec5a56beabd890
          git switch --detach "$expected_head"
          vp fmt --check src/views/settings/licenses-panel.tsx src/views/settings/trackers-panel.tsx src/views/settings/tab-registry.ts tests/refract-api.test.mjs docs/refract.md
          git diff --check
          vp run typecheck
          node --import ./scripts/node-test-environment.mjs --experimental-loader ./scripts/node-test-loader.mjs --test tests/refract-api.test.mjs tests/refract-library-removal.test.mjs tests/refract-sync.test.mjs tests/refract-locales.test.mjs
