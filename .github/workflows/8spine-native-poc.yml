name: 8SPINE native fixture runtime
on:
  push:
    branches: [feature/8spine-compatibility-probe]
    paths:
      - "tools/8spine-native-poc/**"
      - ".github/workflows/8spine-native-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Native fixture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test standalone embedded engine
        run: cargo test --manifest-path tools/8spine-native-poc/Cargo.toml
