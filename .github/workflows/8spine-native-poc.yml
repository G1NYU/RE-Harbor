name: 8SPINE native fixture runtime
on:
  push:
    branches: [feature/8spine-upstream]
    paths:
      - "tools/8spine-native-poc/**"
      - "tools/8spine-*.mjs"
      - "tests/8spine-*.mjs"
      - "docs/8spine-connector.md"
      - "src-tauri/src/music/fixture_8spine.rs"
      - "src-tauri/src/music/eightspine_catalog.rs"
      - "src-tauri/src/music/eightspine_search.rs"
      - "src-tauri/src/music/registry.rs"
      - "src-tauri/src/lib.rs"
      - "src/components/music/eightspine-repositories.tsx"
      - "src/components/music/music-connections.tsx"
      - "src-tauri/src/music.rs"
      - ".github/workflows/8spine-native-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Native fixture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test standalone embedded engine
        run: cargo test --manifest-path tools/8spine-native-poc/Cargo.toml

  harbor-contract:
    name: Harbor native fixture connector (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libayatana-appindicator3-dev libgtk-3-dev libmpv-dev libpulse-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
            tools/8spine-native-poc
      - name: Build fixture worker
        run: cargo build --manifest-path tools/8spine-native-poc/Cargo.toml
      - name: Test actual Harbor connector registry and worker IPC
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        shell: bash
        run: |
          set -euo pipefail
          export HARBOR_8SPINE_TEST_WORKER="$GITHUB_WORKSPACE/tools/8spine-native-poc/target/debug/harbor-8spine-native-poc"
          test -x "$HARBOR_8SPINE_TEST_WORKER"
          cargo test --manifest-path src-tauri/Cargo.toml --lib music::fixture_8spine::tests::native_fixture_registration -- --ignored --exact
          cargo test --manifest-path src-tauri/Cargo.toml --lib music::eightspine_catalog::tests::public_repository_preview -- --ignored --exact

  harbor-regression:
    name: Full Harbor native regression (independent)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libayatana-appindicator3-dev libgtk-3-dev libmpv-dev libpulse-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
      - name: Full Harbor native suite
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
          HARBOR_GAME_TEST_ROOT: ${{ runner.temp }}/harbor-game-tests
        run: |
          mkdir -p "$HARBOR_GAME_TEST_ROOT"
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

  linux-isolation:
    name: Linux namespace isolation (fixture-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install namespace sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
      - name: Build trusted fixture executable
        run: cargo build --manifest-path tools/8spine-native-poc/Cargo.toml
      - name: Diagnose namespace launch and provision scoped distro profile
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          dpkg-query -W bubblewrap apparmor-profiles apparmor-utils
          worker="$GITHUB_WORKSPACE/tools/8spine-native-poc/target/debug/harbor-8spine-native-poc"
          test -x "$worker"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          # Reproduce the production-shaped fixture invocation without redacting
          # launcher stderr. Only a compiled-in, synthetic music fixture is run.
          sandbox_args=(--unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts --disable-userns --die-with-parent --new-session --cap-drop ALL --clearenv --dev /dev --size 16777216 --tmpfs /tmp --chdir /tmp)
          for lib in /lib /lib64 /usr/lib /usr/lib64; do
            if [[ -d "$lib" ]]; then
              sandbox_args+=(--ro-bind "$lib" "$lib")
            fi
          done
          sandbox_args+=(--ro-bind "$worker" /worker -- /worker)
          probe() {
            printf '%s' '{"fixture":"catalog","operation":"search","query":"test tone","limit":10}' |
              timeout 8s /usr/bin/bwrap "${sandbox_args[@]}" >reply.json 2>launcher.err
          }
          if ! probe; then
            cat launcher.err >&2
            if ! grep -Eiq 'operation not permitted|permission denied|no permissions to create|not allowed' launcher.err; then
              echo "::error::Namespace preflight failed for a reason other than a known permission restriction."
              exit 1
            fi
            if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" != "1" ]]; then
              echo "::error::Namespace launch failed without the expected Ubuntu AppArmor restriction."
              exit 1
            fi
            profile=/etc/apparmor.d/bwrap-userns-restrict
            shipped=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            profiles="$(sudo aa-status)"
            if grep -qi 'bwrap' <<< "$profiles"; then
              echo "::error::A Bubblewrap profile is already active; refusing to replace or stack profiles."
              exit 1
            fi
            if [[ ! -f "$profile" ]]; then
              test -f "$shipped"
              sudo install -m 0644 "$shipped" "$profile"
            fi
            sudo apparmor_parser -r "$profile"
            # Preserve the global user-namespace restriction. Do not elevate the
            # worker, disable AppArmor, share the host network, or fall back.
            test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1"
            if ! probe; then
              cat launcher.err >&2
              exit 1
            fi
          fi
          python3 -c 'import json; r=json.load(open("reply.json")); assert r["ok"] is True and r["result"]["tracks"][0]["id"] == 42'
      - name: Test real host filesystem and network denial
        run: cargo test --manifest-path tools/8spine-native-poc/Cargo.toml --test supervisor linux_namespace_isolation -- --ignored --exact
      - name: Search real song metadata through the host runner
        run: cargo test --manifest-path tools/8spine-native-poc/Cargo.toml --test live_search_runner -- --ignored --exact --nocapture

  windows-isolation:
    name: Windows AppContainer isolation (fixture-only, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build trusted fixture worker with static CRT
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --manifest-path tools/8spine-native-poc/Cargo.toml --features windows-sandbox-fixture
      - name: Build native AppContainer harness
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /W4 /DUNICODE /D_UNICODE tools\8spine-native-poc\windows\appcontainer_fixture.cpp /Fe:"%RUNNER_TEMP%\8spine-appcontainer-fixture.exe" /link userenv.lib advapi32.lib ole32.lib user32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /c /GS- /Zl /O1 tools\8spine-native-poc\windows\startup_probe.cpp /Fo:"%RUNNER_TEMP%\8spine-startup-probe.obj"
          if errorlevel 1 exit /b 1
          link /nologo /nodefaultlib /entry:fixture_entry /subsystem:windows /out:"%RUNNER_TEMP%\8spine-startup-probe.exe" "%RUNNER_TEMP%\8spine-startup-probe.obj" kernel32.lib
          if errorlevel 1 exit /b 1
          dumpbin /headers "%RUNNER_TEMP%\8spine-startup-probe.exe" | findstr /I subsystem
          if errorlevel 1 exit /b 1
          dumpbin /headers tools\8spine-native-poc\target\debug\harbor-8spine-native-poc.exe | findstr /I subsystem
          if errorlevel 1 exit /b 1
          dumpbin /dependents "%RUNNER_TEMP%\8spine-startup-probe.exe"
          if errorlevel 1 exit /b 1
          dumpbin /dependents tools\8spine-native-poc\target\debug\harbor-8spine-native-poc.exe
          if errorlevel 1 exit /b 1
      - name: Test AppContainer identity, filesystem and loopback denial
        shell: pwsh
        run: |
          & ./tools/8spine-native-poc/windows/test-appcontainer.ps1 -Harness "$env:RUNNER_TEMP/8spine-appcontainer-fixture.exe" -Worker "$env:GITHUB_WORKSPACE/tools/8spine-native-poc/target/debug/harbor-8spine-native-poc.exe" -StartupProbe "$env:RUNNER_TEMP/8spine-startup-probe.exe"
      - name: Test Rust supervisor through native AppContainer launcher
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          HARBOR_8SPINE_TEST_LAUNCHER: ${{ runner.temp }}/8spine-appcontainer-fixture.exe
        run: cargo test --manifest-path tools/8spine-native-poc/Cargo.toml --features windows-sandbox-fixture --test windows_supervisor -- --ignored --exact windows_supervised_fixture

  live-catalog:
    name: Live 8SPINE catalog (external network)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch only the user-approved repository index
        run: cargo test --manifest-path tools/8spine-native-poc/Cargo.toml --test live_catalog -- --ignored --exact live_catalog_index --nocapture

      - name: Inspect one fixed public package without executing it
        run: cargo test --manifest-path tools/8spine-native-poc/Cargo.toml --test live_catalog -- --ignored --exact live_public_package_metadata --nocapture

  frontend:
    name: Full frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 1.5.1
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - name: Formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only 2fbc673dd15994e60c8109f5a7e3446efa2dd449 HEAD | grep -E '\.(md|yml|mjs|js|toml)$')
          if ! vp fmt --check "${files[@]}"; then
            # Report the exact formatter diff in the disposable checkout.
            vp fmt "${files[@]}"
            git diff -- "${files[@]}"
            exit 1
          fi
          mapfile -t code < <(printf '%s\n' "${files[@]}" | grep -E '\.(js|mjs)$')
          vp check --no-fmt "${code[@]}"
      - name: Focused JavaScript tests
        run: node --test tests/8spine-probe.test.mjs tests/8spine-fixture-contract.test.mjs tests/8spine-runtime.test.mjs
      - name: Typecheck
        run: vp run typecheck
      - name: Full frontend tests
        run: vp run test
