name: 8SPINE quality diagnostics
on:
  push:
    branches: [fix/8spine-quality-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    name: Formatter repair and full frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - name: Format actual changed files and print repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only cd2a0aff335fb9936146b6434098a7e10b14a421 a269d484c1f64005a619119e61c0a912ba8aea56 | grep -E '\.(md|yml|mjs|js|toml)$')
          vp fmt "${files[@]}"
          git diff --no-color --no-ext-diff -- "${files[@]}"
          vp fmt --check "${files[@]}"
          mapfile -t code < <(printf '%s\n' "${files[@]}" | grep -E '\.(js|mjs)$')
          vp check --no-fmt "${code[@]}"
      - name: 8SPINE JavaScript tests
        run: node --test tests/8spine-probe.test.mjs tests/8spine-fixture-contract.test.mjs tests/8spine-runtime.test.mjs
      - name: Full frontend typecheck
        run: vp run typecheck
      - name: Full frontend tests
        run: vp run test
  baseline:
    name: Unmodified Harbor baseline native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cd2a0aff335fb9936146b6434098a7e10b14a421
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libayatana-appindicator3-dev libgtk-3-dev libmpv-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
      - name: Full native tests on unchanged baseline
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml
